name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.22.0
  VSCE_VERSION: 3.9.2
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Determine release version
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected major.minor.patch version, got ${version}" >&2
            exit 1
          fi
          tag="v${version}"
          # The first push to a new repository (or a force-push) has no previous `main` commit in the
          # fetched history: release the current version instead of failing on `git show`.
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            previous_version="$(git show "${BEFORE_SHA}:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            if [[ "${version}" == "${previous_version}" ]]; then
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              echo "Package version unchanged (${version}); no release"
              exit 0
            fi
            node -e '
              const current = process.argv[1].split(".").map(Number);
              const previous = process.argv[2].split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                if (current[i] > previous[i]) process.exit(0);
                if (current[i] < previous[i]) break;
              }
              console.error(`Version must increase: ${process.argv[2]} -> ${process.argv[1]}`);
              process.exit(1);
            ' "${version}" "${previous_version}"
          else
            echo "Previous commit ${BEFORE_SHA} is not in history; releasing ${version}"
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "vsix=$(node -p "const p = require('./package.json'); p.name + '-' + p.version + '.vsix'")" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Typecheck
        if: steps.release.outputs.publish == 'true'
        run: pnpm typecheck

      - name: Run unit tests
        if: steps.release.outputs.publish == 'true'
        run: pnpm test

      - name: Package extension
        if: steps.release.outputs.publish == 'true'
        env:
          VSIX_FILE: ${{ steps.release.outputs.vsix }}
        run: |
          pnpm dlx "@vscode/vsce@${VSCE_VERSION}" package
          test -s "${VSIX_FILE}"

      - name: Create or update GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VSIX_FILE: ${{ steps.release.outputs.vsix }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Tag ${RELEASE_TAG} points to ${tag_commit}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          fi
          git push origin "refs/tags/${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | grep -Fxq "${VSIX_FILE}"; then
              echo "Release ${RELEASE_TAG} already contains ${VSIX_FILE}"
            else
              gh release upload "${RELEASE_TAG}" "${VSIX_FILE}"
            fi
          else
            gh release create "${RELEASE_TAG}" "${VSIX_FILE}" --generate-notes --verify-tag --latest
          fi
